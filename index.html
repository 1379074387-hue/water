<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小杨快喝</title>
  <meta name="description" content="治愈系花田风喝水提醒，喝水让小花开">
  <meta name="theme-color" content="#f2c14e">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小杨快喝">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 背景层：花田照片 + 游走的光 + 飘落的花瓣（和待办版同一套） -->
  <div class="bg" aria-hidden="true">
    <div class="bg-photo"></div>
    <div class="bg-glow"></div>
    <div class="petals">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <!-- 背景里摇摆的花：位置/大小/节奏各不相同 -->
    <div class="bg-flowers" aria-hidden="true">
      <svg class="bf" style="--x:5%;--y:56%;--s:.85;--t:7s;--dl:0s" viewBox="0 0 100 120"><path d="M50 118 C50 100 50 88 50 74" stroke="#7BAE6A" stroke-width="5" stroke-linecap="round"/><g fill="#F9A8C9" opacity=".88"><ellipse cx="50" cy="34" rx="13" ry="22"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(72 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(144 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(216 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(288 50 56)"/></g><circle cx="50" cy="56" r="12" fill="#F5B942"/></svg>
      <svg class="bf" style="--x:86%;--y:62%;--s:1.1;--t:8.5s;--dl:-3s" viewBox="0 0 100 120"><path d="M50 118 C50 100 50 88 50 74" stroke="#7BAE6A" stroke-width="5" stroke-linecap="round"/><g fill="#FFF6E8" opacity=".9"><ellipse cx="50" cy="34" rx="13" ry="22"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(72 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(144 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(216 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(288 50 56)"/></g><circle cx="50" cy="56" r="12" fill="#F5B942"/></svg>
      <svg class="bf" style="--x:10%;--y:80%;--s:1.25;--t:9.5s;--dl:-5s" viewBox="0 0 100 120"><path d="M50 118 C50 100 50 88 50 74" stroke="#7BAE6A" stroke-width="5" stroke-linecap="round"/><g fill="#FBD9A0" opacity=".9"><ellipse cx="50" cy="34" rx="13" ry="22"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(72 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(144 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(216 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(288 50 56)"/></g><circle cx="50" cy="56" r="12" fill="#E89B2D"/></svg>
      <svg class="bf" style="--x:78%;--y:26%;--s:.7;--t:6.5s;--dl:-2s" viewBox="0 0 100 120"><path d="M50 118 C50 100 50 88 50 74" stroke="#7BAE6A" stroke-width="5" stroke-linecap="round"/><g fill="#F9A8C9" opacity=".85"><ellipse cx="50" cy="34" rx="13" ry="22"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(72 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(144 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(216 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(288 50 56)"/></g><circle cx="50" cy="56" r="12" fill="#F5B942"/></svg>
      <svg class="bf" style="--x:64%;--y:84%;--s:.95;--t:8s;--dl:-6.5s" viewBox="0 0 100 120"><path d="M50 118 C50 100 50 88 50 74" stroke="#7BAE6A" stroke-width="5" stroke-linecap="round"/><g fill="#FFF6E8" opacity=".88"><ellipse cx="50" cy="34" rx="13" ry="22"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(72 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(144 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(216 50 56)"/><ellipse cx="50" cy="34" rx="13" ry="22" transform="rotate(288 50 56)"/></g><circle cx="50" cy="56" r="12" fill="#F5B942"/></svg>
    </div>
  </div>

  <main class="app">
    <header>
      <button id="bgm-toggle" class="bgm-btn" aria-label="背景音乐开关">🔊</button>
      <h1>小杨快喝</h1>
      <p class="subtitle">今天也要水灵灵的 💧</p>
    </header>
    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

    <!-- 督促语：根据时间和进度换文案 -->
    <p id="nudge" class="nudge"></p>

    <!-- 主视觉：会开花的进度 -->
    <section class="hero card">
      <svg id="flower" viewBox="0 0 200 220" aria-hidden="true">
        <path d="M100 212 C100 184 100 162 100 142" stroke="#5FA052" stroke-width="10" stroke-linecap="round" fill="none"/>
        <path d="M100 178 C70 178 55 162 50 142 C72 144 92 158 100 178 Z" fill="#6FB35E"/>
        <path d="M100 178 C130 178 145 162 150 142 C128 144 108 158 100 178 Z" fill="#7CC46A"/>
        <g id="petals">
          <g transform="rotate(0 100 96)"><ellipse cx="100" cy="54" rx="20" ry="36" fill="#F6D98A" opacity="0.55"/><ellipse class="vivid" cx="100" cy="54" rx="20" ry="36" fill="#F9A8C9" opacity="0"/></g>
          <g transform="rotate(45 100 96)"><ellipse cx="100" cy="54" rx="20" ry="36" fill="#F6D98A" opacity="0.55"/><ellipse class="vivid" cx="100" cy="54" rx="20" ry="36" fill="#F9A8C9" opacity="0"/></g>
          <g transform="rotate(90 100 96)"><ellipse cx="100" cy="54" rx="20" ry="36" fill="#F6D98A" opacity="0.55"/><ellipse class="vivid" cx="100" cy="54" rx="20" ry="36" fill="#F9A8C9" opacity="0"/></g>
          <g transform="rotate(135 100 96)"><ellipse cx="100" cy="54" rx="20" ry="36" fill="#F6D98A" opacity="0.55"/><ellipse class="vivid" cx="100" cy="54" rx="20" ry="36" fill="#F9A8C9" opacity="0"/></g>
          <g transform="rotate(180 100 96)"><ellipse cx="100" cy="54" rx="20" ry="36" fill="#F6D98A" opacity="0.55"/><ellipse class="vivid" cx="100" cy="54" rx="20" ry="36" fill="#F9A8C9" opacity="0"/></g>
          <g transform="rotate(225 100 96)"><ellipse cx="100" cy="54" rx="20" ry="36" fill="#F6D98A" opacity="0.55"/><ellipse class="vivid" cx="100" cy="54" rx="20" ry="36" fill="#F9A8C9" opacity="0"/></g>
          <g transform="rotate(270 100 96)"><ellipse cx="100" cy="54" rx="20" ry="36" fill="#F6D98A" opacity="0.55"/><ellipse class="vivid" cx="100" cy="54" rx="20" ry="36" fill="#F9A8C9" opacity="0"/></g>
          <g transform="rotate(315 100 96)"><ellipse cx="100" cy="54" rx="20" ry="36" fill="#F6D98A" opacity="0.55"/><ellipse class="vivid" cx="100" cy="54" rx="20" ry="36" fill="#F9A8C9" opacity="0"/></g>
        </g>
        <circle cx="100" cy="96" r="20" fill="#F5B942"/>
        <circle cx="100" cy="96" r="20" fill="#E89B2D" opacity="0.35"/>
      </svg>
      <div class="numbers"><span id="today-ml">0</span><span class="unit">ml</span></div>
      <div class="goal-line">目标 <span id="goal-ml">2000</span> ml · <span id="pct">0%</span></div>
      <div class="bar"><div id="bar-fill"></div></div>
    </section>

    <!-- 快捷记录：一杯的量 -->
    <section class="add card">
      <button type="button" data-ml="100">+100<span>小口</span></button>
      <button type="button" data-ml="250">+250<span>一杯</span></button>
      <button type="button" data-ml="500">+500<span>大杯</span></button>
    </section>

    <!-- 自定义一杯：滑块 -->
    <section class="card">
      <h2>自定义一杯</h2>
      <div class="slider-row">
        <input id="ml-slider" type="range" min="0" max="500" step="50" value="250">
        <span id="ml-val">250 ml</span>
      </div>
      <button id="ml-add" type="button" class="wide-btn">记下这杯 💧</button>
    </section>

    <!-- 今日记录 -->
    <section class="card">
      <div class="sec-head"><h2>今日记录</h2><button id="clear-today" type="button" class="link-btn">清空今日</button></div>
      <ul id="log-list"></ul>
      <p id="empty-tip" class="empty-tip">还没喝第一口，快来浇花 🌱</p>
    </section>

    <!-- 打卡统计 -->
    <section class="card">
      <h2>小花档案</h2>
      <p class="streak">连续达标 <b id="streak">0</b> 天 🔥</p>
      <div id="week-chart" class="week"></div>
    </section>

    <!-- 目标设置 -->
    <section class="card settings">
      <h2>每日目标</h2>
      <div class="goal-row">
        <input id="goal-input" type="number" min="500" max="5000" step="100" value="2000">
        <span>ml</span>
        <button id="goal-save" type="button">保存</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
